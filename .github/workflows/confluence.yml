# Publishes the architecture documentation to Confluence.
#
# Separate from pages.yml on purpose: that one needs only Node and Antora, this one
# needs a JDK and the freshly built plugin, and it fails for entirely different
# reasons (credentials, permissions, API limits).
#
# Required repository secrets:
#   CONFLUENCE_URL        the Confluence base URL. A classic API token uses the site form
#                         https://<site>.atlassian.net/wiki; a scoped token — the only kind a
#                         service account can create — must use the gateway form
#                         https://api.atlassian.com/ex/confluence/<cloudId>/wiki, and needs
#                         scopes covering pages, attachments, content properties and, while
#                         deleteOrphans is enabled, page deletion.
#   CONFLUENCE_USERNAME   the Atlassian account e-mail
#   CONFLUENCE_API_TOKEN  API token from id.atlassian.com
#
# The URL is a secret for hygiene rather than for security: the cloud id it may contain is
# served unauthenticated from https://<site>.atlassian.net/_edge/tenant_info, so it is not
# confidential. The cost is that GitHub masks it as *** in logs, which hides the target when
# a publish fails.
#
# The credentials cannot be passed on the command line — username and password are
# deliberately configuration-only parameters so they cannot end up in a build log.
# setup-java therefore writes a settings.xml with a <server id="confluence"> entry
# whose values come from the environment, and the build points serverId at it.

name: Publish to Confluence

on:
  push:
    branches: [ "main" ]
    paths:
      - 'architecture-docs/**'
      - 'wiki-publisher/**'
      - 'wiki-client/**'
      - 'maven-plugin/**'
      - '.github/workflows/confluence.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs write into the same space at once, and never cancel a running
# publish — an aborted publish leaves the space half updated.
concurrency:
  group: confluence-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Writes ~/.m2/settings.xml with a server entry read from the environment.
          server-id: confluence
          server-username: CONFLUENCE_USERNAME
          server-password: CONFLUENCE_API_TOKEN

      # install, not package: the publish step below runs as a separate Maven
      # invocation and can only resolve the plugin from the local repository.
      # The same run produces the Antora site in architecture-docs/target/docs.
      #
      # Everything that only exists for publishing to Maven Central is skipped —
      # signing, sources and javadoc. GPG in particular is bound to the verify
      # phase of the default build, so without gpg.skip this job would fail with
      # "no default secret key": the signing key is deliberately not available
      # here, because this workflow publishes documentation, not artifacts.
      #
      # Tests do run: publishing with a broken publisher is worse than not
      # publishing, and they cost a couple of seconds.
      - name: Build modules and generate the site
        run: >
          ./mvnw -B clean install
          -Dgpg.skip=true
          -Dmaven.javadoc.skip=true
          -Dmaven.source.skip=true

      # No clean between install and publish — the publish reads the site that the
      # previous step generated in target/.
      - name: Publish to Confluence
        run: >
          ./mvnw -B -pl architecture-docs atlassian:publish
          -Dprivate.wiki.url="$CONFLUENCE_URL"
          -Dprivate.wiki.serverId=confluence
        env:
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
