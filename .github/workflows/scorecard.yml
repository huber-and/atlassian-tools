# Runs the OpenSSF Scorecard and uploads the result to the repository's code
# scanning view, next to the CodeQL findings.
#
# Action refs are pinned to commit SHAs, not tags. Scorecard's own Pinned-Dependencies
# check rewards that, and a tag can be moved to point at different code while a SHA
# cannot — which matters more here than elsewhere, because this workflow runs with
# security-events: write.
#
# publish_results: true sends the result to the public Scorecard API, which is what
# makes the badge and the REST API work. The score is computed from public repository
# data either way, so nothing is disclosed that could not be derived.

name: OpenSSF Scorecard

on:
  push:
    branches: [ "main" ]
  # Weekly, so the score keeps up with changes outside the repository — an
  # unmaintained dependency or a new advisory moves it without a commit here.
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF result to code scanning.
      security-events: write
      # Needed by publish_results to obtain GitHub's OIDC token, which proves the
      # result really comes from this repository.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
