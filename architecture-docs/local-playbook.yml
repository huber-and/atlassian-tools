site:
  title: Atlassian Tools — Architecture
  start_page: docs::index.adoc
  # Deliberately no site.url here. Antora derives canonical and sitemap URLs from it, and a
  # Confluence space URL produces nonsense like .../spaces/AT/docs/main/page.html. The link to
  # the published space lives in the footer instead. playbook.yml sets the real URL for Pages.
content:
  edit_url: ~
  sources:
    - url: ../
      edit_url: ~
      version: main
      start_paths:
        - architecture-docs/src/main/docs
asciidoc:
  attributes:
    sectanchors: true
output:
  dir: ./target/docs
  destinations:
  # Antora 3.2.0 changed file-publisher: once `destinations` is set, the fs
  # destination implied by `output.dir` is only added if an explicit `fs`
  # entry (with no path of its own) is present here too. Without this entry,
  # only the archive below would be produced and target/docs would stay
  # empty, which is exactly what AntoraParser reads.
  - provider: fs
  - provider: archive
    path: ./target/architecture-docs.zip
ui:
  supplemental_files: ./supplemental-ui
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
runtime:
  fetch: true
  cache_dir: ./target/cache
  log:
    format: pretty
#    level: all
#    destination:
#      file: ./antora.log
#      append: false
#      buffer_size: 4096
#      sync: false
antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_latest_only: true
